<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Весенний Вызов</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* Легкий весенний градиент */
            background: radial-gradient(circle, #e8f5e9 0%, #a5d6a7 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            color: #2e7d32;
            user-select: none;
        }

        /* --- ЛЕГКИЕ CSS-ЧАСТИЦЫ (БЕЗ ЛАГОВ JS) --- */
        .petal {
            position: absolute;
            font-size: 2rem;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            opacity: 0.6;
            animation: float 12s linear infinite;
            /* Аппаратное ускорение */
            will-change: transform; 
        }

        .p1 { left: 10%; animation-duration: 10s; animation-delay: 0s; }
        .p2 { left: 30%; animation-duration: 14s; animation-delay: -2s; font-size: 1.2rem; }
        .p3 { left: 50%; animation-duration: 11s; animation-delay: -5s; }
        .p4 { left: 70%; animation-duration: 15s; animation-delay: -1s; font-size: 1.5rem; }
        .p5 { left: 90%; animation-duration: 13s; animation-delay: -4s; }

        @keyframes float {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* --- ЦЕНТРАЛЬНЫЙ БЛОК --- */
        .button-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- ВЕСЕННЯЯ КНОПКА --- */
        #callBtn {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            border: 6px solid #ffffff;
            /* Яркий солнечный цвет */
            background: radial-gradient(circle at 30% 30%, #ffca28, #f57c00);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15); /* Упрощенная тень для производительности */
            cursor: pointer;
            outline: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            color: white;
        }

        #callBtn::after {
            content: '';
            position: absolute;
            top: 15%;
            left: 15%;
            width: 50px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(-45deg);
        }

        #callBtn h1 {
            font-size: 2rem;
            margin: 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
            z-index: 2;
        }

        #callBtn p {
            font-size: 1rem;
            margin-top: 5px;
            opacity: 0.95;
            z-index: 2;
        }

        /* --- СОСТОЯНИЕ АКТИВНОГО ВЫЗОВА --- */
        #callBtn.calling {
            /* Зеленый цвет при вызове */
            background: radial-gradient(circle at 30% 30%, #66bb6a, #2e7d32);
            /* Анимация пульсации без теней (не грузит GPU) */
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        .status-msg {
            margin-top: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            min-height: 1.5em;
            color: #1b5e20;
        }

    </style>
</head>
<body>

    <div class="petal p1">🌸</div>
    <div class="petal p2">🍃</div>
    <div class="petal p3">🌸</div>
    <div class="petal p4">🌿</div>
    <div class="petal p5">🌸</div>

    <div class="button-container">
        <button id="callBtn">
            <h1>🌸 ВЫЗВАТЬ</h1>
            <p>сотрудника</p>
        </button>
        <div class="status-msg" id="statusMsg">Хорошего весеннего дня!</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBa3MKrLHcRPauIyzxgxfNpLUphmehJAkg",
          authDomain: "moon-logistik.firebaseapp.com",
          databaseURL: "https://moon-logistik-default-rtdb.firebaseio.com",
          projectId: "moon-logistik",
          storageBucket: "moon-logistik.firebasestorage.app",
          messagingSenderId: "335239459996",
          appId: "1:335239459996:web:98a3cd3508767cfde6a959",
          measurementId: "G-N3GHR5KS7Q"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const statusRef = ref(db, 'cashier_call/status');

        const btn = document.getElementById('callBtn');
        const btnTitle = btn.querySelector('h1');
        const btnSub = btn.querySelector('p');
        const statusMsg = document.getElementById('statusMsg');
        
        let isCalling = false;

        // 1. СЛУШАЕМ БАЗУ
        onValue(statusRef, (snapshot) => {
            const data = snapshot.val();
            isCalling = data ? data.is_calling : false;
            updateAnimation(isCalling);
        });

        // 2. ОТПРАВЛЯЕМ ВЫЗОВ + ЗАПРЕЩАЕМ ЭКРАНУ ГАСНУТЬ
        btn.addEventListener('click', () => {
            const newState = !isCalling;
            set(statusRef, {
                is_calling: newState,
                timestamp: Date.now()
            });
            keepScreenOn();
        });

        document.addEventListener('click', keepScreenOn);

        function updateAnimation(active) {
            if (active) {
                btn.classList.add('calling');
                btnTitle.textContent = "⏳ ОЖИДАЙТЕ";
                btnSub.textContent = "сигнал отправлен...";
                statusMsg.textContent = "Сотрудник уже спешит к вам!";
            } else {
                btn.classList.remove('calling');
                btnTitle.textContent = "🌸 ВЫЗВАТЬ";
                btnSub.textContent = "сотрудника";
                statusMsg.textContent = "Нажмите на кнопку, чтобы позвать помощь";
            }
        }

        // --- ВЕЧНЫЙ ЭКРАН (Wake Lock API) ---
        // (Оставлен без изменений, так как логика работает корректно)
        let wakeLock = null;

        async function keepScreenOn() {
            if (wakeLock !== null) return; 

            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Экран заблокирован от выключения (Wake Lock Active)');
                    
                    wakeLock.addEventListener('release', () => {
                        console.log('Wake Lock сброшен');
                        wakeLock = null;
                    });
                }
            } catch (err) {
                console.error(`Ошибка Wake Lock: ${err.name}, ${err.message}`);
            }
        }
        
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock === null && document.visibilityState === 'visible') {
                await keepScreenOn();
            }
        });

    </script>
</body>
</html>
