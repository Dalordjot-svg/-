<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Вызов официанта</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(circle at center, #4e342e 0%, #21130d 100%);
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            color: #ffecd2;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* --- ЭФФЕКТ БОКЕ --- */
        .bokeh {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 179, 0, 0.4) 0%, rgba(255, 179, 0, 0) 70%);
            filter: blur(8px);
            animation: float-light linear infinite alternate;
            pointer-events: none;
            z-index: 1;
        }

        .b1 { width: 150px; height: 150px; left: 5%; top: 10%; animation-duration: 8s; }
        .b2 { width: 250px; height: 250px; right: 10%; top: 20%; animation-duration: 12s; }
        .b3 { width: 100px; height: 100px; left: 20%; bottom: 15%; animation-duration: 10s; }
        .b4 { width: 200px; height: 200px; right: 15%; bottom: 5%; animation-duration: 14s; }

        @keyframes float-light {
            0% { transform: translateY(0) scale(1); opacity: 0.5; }
            100% { transform: translateY(-30px) scale(1.1); opacity: 0.8; }
        }

        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- РАДАР --- */
        .radar-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 260px;
            height: 260px;
            border-radius: 50%;
            border: 2px solid #ffca28;
            opacity: 0;
            pointer-events: none;
        }

        .calling .radar-ring:nth-child(1) { animation: pulse-ring 2s infinite ease-out; }
        .calling .radar-ring:nth-child(2) { animation: pulse-ring 2s infinite ease-out 0.6s; }
        .calling .radar-ring:nth-child(3) { animation: pulse-ring 2s infinite ease-out 1.2s; }

        @keyframes pulse-ring {
            0% { width: 260px; height: 260px; opacity: 0.8; }
            100% { width: 450px; height: 450px; opacity: 0; }
        }

        /* --- КНОПКА --- */
        #callBtn {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(145deg, #d7ccc8, #a1887f);
            box-shadow: 
                8px 8px 16px rgba(0, 0, 0, 0.5), 
                -8px -8px 16px rgba(255, 255, 255, 0.05),
                inset 2px 2px 5px rgba(255,255,255,0.4);
            cursor: pointer;
            outline: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            -webkit-tap-highlight-color: transparent;
            color: #3e2723;
            overflow: hidden; 
        }

        #callBtn:not(.calling-state) {
            animation: idleHover 4s ease-in-out infinite alternate;
        }

        @keyframes idleHover {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }

        #callBtn:active {
            transform: scale(0.95);
            box-shadow: 4px 4px 8px rgba(0,0,0,0.6), -4px -4px 8px rgba(255,255,255,0.05);
        }

        /* ИСПРАВЛЕНИЕ 1: Добавлено position: relative для корректной работы z-index */
        #callBtn h1, #callBtn p, .icon {
            position: relative;
            z-index: 2; 
        }

        #callBtn h1 {
            font-size: 2.2rem;
            margin: 0;
            font-weight: 700;
            letter-spacing: 1px;
        }

        #callBtn p {
            font-size: 1rem;
            margin-top: 5px;
            font-weight: 600;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        #callBtn.calling-state {
            background: linear-gradient(145deg, #ffca28, #ff8f00);
            color: #fff;
            box-shadow: 
                0 0 30px rgba(255, 143, 0, 0.6),
                inset 2px 2px 5px rgba(255,255,255,0.5);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        /* --- ЭФФЕКТ ВОЛНЫ --- */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0);
            animation: ripple-effect 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple-effect {
            to { transform: scale(4); opacity: 0; }
        }

        .status-msg {
            margin-top: 40px;
            font-size: 1.2rem;
            font-weight: 400;
            text-align: center;
            min-height: 1.5em;
            color: #ffcc80;
            letter-spacing: 0.5px;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="bokeh b1"></div>
    <div class="bokeh b2"></div>
    <div class="bokeh b3"></div>
    <div class="bokeh b4"></div>

    <div class="container" id="mainContainer">
        <div class="radar-ring"></div>
        <div class="radar-ring"></div>
        <div class="radar-ring"></div>

        <button id="callBtn">
            <div class="icon" id="btnIcon">☕</div>
            <h1 id="btnTitle">ВЫЗВАТЬ</h1>
            <p id="btnSub">официанта</p>
        </button>
        <div class="status-msg" id="statusMsg">Нажмите, чтобы позвать сотрудника</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBa3MKrLHcRPauIyzxgxfNpLUphmehJAkg",
          authDomain: "moon-logistik.firebaseapp.com",
          databaseURL: "https://moon-logistik-default-rtdb.firebaseio.com",
          projectId: "moon-logistik",
          storageBucket: "moon-logistik.firebasestorage.app",
          messagingSenderId: "335239459996",
          appId: "1:335239459996:web:98a3cd3508767cfde6a959",
          measurementId: "G-N3GHR5KS7Q"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const statusRef = ref(db, 'cashier_call/status');

        const btn = document.getElementById('callBtn');
        const container = document.getElementById('mainContainer');
        const btnIcon = document.getElementById('btnIcon');
        const btnTitle = document.getElementById('btnTitle');
        const btnSub = document.getElementById('btnSub');
        const statusMsg = document.getElementById('statusMsg');
        
        let isCalling = false;

        // ИСПРАВЛЕНИЕ 2 и 4: Оптимизированный Ripple + очистка DOM
        function createRipple(event) {
            const circle = document.createElement('span');
            const diameter = Math.max(btn.clientWidth, btn.clientHeight);
            const radius = diameter / 2;
            const rect = btn.getBoundingClientRect();

            // pointerdown содержит точные координаты (clientX/Y) для мыши и касаний
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${event.clientX - rect.left - radius}px`;
            circle.style.top = `${event.clientY - rect.top - radius}px`;
            circle.classList.add('ripple');

            // Удаляем старые волны, если они не успели исчезнуть при быстром клике
            const existingRipples = btn.querySelectorAll('.ripple');
            existingRipples.forEach(r => r.remove());

            btn.appendChild(circle);

            // Очищаем DOM после завершения анимации (600ms = 0.6s)
            setTimeout(() => {
                circle.remove();
            }, 600);
        }

        onValue(statusRef, (snapshot) => {
            const data = snapshot.val();
            isCalling = data ? data.is_calling : false;
            updateAnimation(isCalling);
        });

        // ИСПРАВЛЕНИЕ 3: Используем современный pointerdown вместо связки mousedown + touchstart
        btn.addEventListener('pointerdown', async (e) => {
            // Захватываем указатель, чтобы избежать прерываний на мобильных
            if(btn.setPointerCapture) btn.setPointerCapture(e.pointerId);

            createRipple(e);
            
            if (navigator.vibrate) navigator.vibrate(50);

            const newState = !isCalling;
            set(statusRef, {
                is_calling: newState,
                timestamp: Date.now()
            });
            await keepScreenOn();
        });

        function updateAnimation(active) {
            if (active) {
                btn.classList.add('calling-state');
                container.classList.add('calling');
                btnIcon.textContent = "🛎️";
                btnTitle.textContent = "ОЖИДАЙТЕ";
                btnSub.textContent = "вызов отправлен";
                statusMsg.textContent = "Официант уже спешит к вашему столику!";
            } else {
                btn.classList.remove('calling-state');
                container.classList.remove('calling');
                btnIcon.textContent = "☕";
                btnTitle.textContent = "ВЫЗВАТЬ";
                btnSub.textContent = "официанта";
                statusMsg.textContent = "Нажмите, чтобы позвать сотрудника";
            }
        }

        let wakeLock = null;

        async function keepScreenOn() {
            if (wakeLock !== null) return; 

            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Wake Lock Active');
                    wakeLock.addEventListener('release', () => {
                        wakeLock = null;
                    });
                }
            } catch (err) {
                console.error(`Wake Lock error: ${err.message}`);
            }
        }
        
        document.addEventListener('pointerdown', keepScreenOn, { once: false });
        
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock === null && document.visibilityState === 'visible') {
                await keepScreenOn();
            }
        });
    </script>
</body>
</html>
