<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Экран Клиента</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap');

        body {
            margin: 0; padding: 0; 
            height: 100vh; 
            background: radial-gradient(circle at center, #4e342e 0%, #21130d 100%);
            font-family: 'Montserrat', sans-serif; 
            overflow: hidden; 
            color: #ffecd2; 
            user-select: none;
            position: relative;
        }

        /* Фоновые частицы */
        .bokeh { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255,179,0,0.4) 0%, rgba(255,179,0,0) 70%); filter: blur(8px); animation: float-light linear infinite alternate; z-index: 1; }
        .b1 { width: 150px; height: 150px; left: 5%; top: 10%; animation-duration: 8s; }
        .b2 { width: 250px; height: 250px; right: 10%; top: 20%; animation-duration: 12s; }

        @keyframes float-light { 0% { transform: translateY(0); opacity: 0.5; } 100% { transform: translateY(-30px); opacity: 0.8; } }

        /* --- КНОПКА ВЫЗОВА (Жесткая центровка) --- */
        .call-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10; 
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.4s ease, transform 0.4s ease;
            width: 100%;
        }
        
        /* Класс для плавного исчезновения с учетом центровки */
        .hidden-scale { transform: translate(-50%, -50%) scale(0) !important; opacity: 0 !important; pointer-events: none; }

        #callBtn {
            width: 260px; height: 260px; border-radius: 50%; border: none;
            background: linear-gradient(145deg, #d7ccc8, #a1887f);
            box-shadow: 8px 8px 16px rgba(0,0,0,0.5), -8px -8px 16px rgba(255,255,255,0.05);
            cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #3e2723; transition: all 0.3s;
        }
        #callBtn:not(.calling-state) { animation: idleHover 4s ease-in-out infinite alternate; }
        @keyframes idleHover { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }
        #callBtn h1 { font-size: 2.2rem; margin: 0; font-weight: 800; z-index: 2; }
        #callBtn p { font-size: 1rem; margin-top: 5px; font-weight: 600; text-transform: uppercase; z-index: 2; }
        .icon { font-size: 2.5rem; margin-bottom: 10px; z-index: 2; }
        #callBtn.calling-state { background: linear-gradient(145deg, #ffca28, #ff8f00); color: #fff; box-shadow: 0 0 30px rgba(255,143,0,0.6); }
        .status-msg { margin-top: 40px; font-size: 1.2rem; text-align: center; color: #ffcc80; transition: opacity 0.3s; }

        /* --- АНИМАЦИЯ ЗЕЛЕНОЙ ВОЛНЫ --- */
        .green-wave {
            position: absolute; top: 50%; left: 50%;
            width: 10px; height: 10px;
            background: linear-gradient(135deg, #43a047, #1b5e20); 
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            z-index: 20; pointer-events: none;
            transition: transform 0.8s cubic-bezier(0.64, 0.04, 0.35, 1);
        }
        .green-wave.active { transform: translate(-50%, -50%) scale(350); }

        /* --- ЦЕНТРАЛЬНАЯ СУММА (Шаг 1) --- */
        .center-bill {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 5rem; font-weight: 800; color: #fff;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 25; opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .center-bill.pop { transform: translate(-50%, -50%) scale(1); opacity: 1; }

        /* --- МОДУЛЬНЫЙ ИНТЕРФЕЙС (Шаг 2) --- */
        .modular-ui {
            position: absolute; 
            top: 50%; left: 50%;
            transform: translate(-50%, -30%); /* Смещено вниз до появления */
            z-index: 30;
            display: flex; gap: 40px; align-items: stretch; justify-content: center;
            opacity: 0; pointer-events: none; 
            transition: opacity 0.6s ease 0.2s, transform 0.6s ease 0.2s;
            width: 90%; max-width: 900px;
        }
        .modular-ui.visible { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%); }

        /* Левый модуль: QR */
        .module-left {
            background: white; padding: 30px; border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 320px;
        }
        .qr-image {
            width: 250px; height: 250px; border-radius: 8px;
            display: block; margin-bottom: 15px;
        }

        /* Правый модуль: Инфа и кнопки */
        .module-right {
            flex: 1; background: rgba(0,0,0,0.3); padding: 40px; border-radius: 24px;
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2);
            display: flex; flex-direction: column; justify-content: space-between;
        }
        
        .bill-info { font-size: 1.2rem; color: #c8e6c9; margin-bottom: 15px; }
        .module-right h2 { margin: 0 0 5px; color: #a5d6a7; font-size: 1.5rem; font-weight: 600; }
        
        /* Сумма чаевых отдельно */
        .tip-display { font-size: 3.5rem; font-weight: 800; color: white; margin-bottom: 20px; text-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        
        .tips-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .tip-btn {
            background: rgba(255,255,255,0.1); border: 2px solid #a5d6a7; color: white;
            padding: 15px 0; border-radius: 12px; font-size: 1.5rem; font-weight: bold;
            cursor: pointer; transition: all 0.2s;
        }
        .tip-btn:active { transform: scale(0.9); }
        .tip-btn.selected { background: #a5d6a7; color: #1b5e20; }

        .instructions { font-size: 1rem; color: #c8e6c9; line-height: 1.5; margin-bottom: 20px; opacity: 0.9; }
        
        .btn-cancel {
            background: transparent; color: white; border: 1px solid white;
            padding: 15px 30px; border-radius: 12px; font-size: 1.2rem;
            cursor: pointer; width: 100%; transition: background 0.2s; margin-top: auto;
        }
        .btn-cancel:active { background: rgba(255,255,255,0.2); }

    </style>
</head>
<body>

    <div class="bokeh b1"></div><div class="bokeh b2"></div>

    <div class="green-wave" id="greenWave"></div>
    <div class="center-bill" id="centerBill">0 ₽</div>

    <div class="call-container" id="callContainer">
        <button id="callBtn">
            <div class="icon" id="btnIcon">☕</div>
            <h1 id="btnTitle">ВЫЗВАТЬ</h1>
            <p id="btnSub">официанта</p>
        </button>
        <div class="status-msg" id="statusMsg">Нажмите, чтобы позвать сотрудника</div>
    </div>

    <div class="modular-ui" id="modularUi">
        <div class="module-left">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https%3A%2F%2Fwww.sberbank.com%2Fsms%2Fpbpn%3FrequisiteNumber%3D79585161679" class="qr-image" alt="QR Сбербанк">
            <p style="color: #333; margin: 0; font-weight: bold; text-align: center;">Отсканируйте камерой<br>или в Сбербанк Онлайн</p>
        </div>

        <div class="module-right">
            <div>
                <div class="bill-info">Сумма заказа: <strong id="baseBillDisplay">0</strong> ₽</div>
                <h2>Сумма чаевых к переводу:</h2>
                <div class="tip-display"><span id="tipTotal">0</span> ₽</div>
                
                <div class="tips-grid">
                    <button class="tip-btn" data-percent="5">5%</button>
                    <button class="tip-btn" data-percent="10">10%</button>
                    <button class="tip-btn" data-percent="15">15%</button>
                </div>

                <div class="instructions">
                    1. Выберите процент чаевых выше.<br>
                    2. Отсканируйте QR-код слева.<br>
                    3. Введите указанную сумму чаевых в приложении.
                </div>
            </div>

            <button class="btn-cancel" id="finishBtn">Завершить</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBa3MKrLHcRPauIyzxgxfNpLUphmehJAkg",
          authDomain: "moon-logistik.firebaseapp.com",
          databaseURL: "https://moon-logistik-default-rtdb.firebaseio.com",
          projectId: "moon-logistik"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const statusRef = ref(db, 'cashier_call/status');
        const tipRequestRef = ref(db, 'tips_request');

        // Элементы
        const callContainer = document.getElementById('callContainer');
        const greenWave = document.getElementById('greenWave');
        const centerBill = document.getElementById('centerBill');
        const modularUi = document.getElementById('modularUi');
        
        const baseBillDisplay = document.getElementById('baseBillDisplay');
        const tipTotalEl = document.getElementById('tipTotal');
        const tipBtns = document.querySelectorAll('.tip-btn');
        
        const dingSound = new Audio("data:audio/mp3;base64,//NExAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//NExAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq");
        
        let currentBaseBill = 0;
        let tipTimeout;

        // --- ЛОГИКА ВЫЗОВА ---
        let isCalling = false;
        const btn = document.getElementById('callBtn');
        
        onValue(statusRef, (snapshot) => {
            const data = snapshot.val();
            isCalling = data ? data.is_calling : false;
            if(isCalling) {
                btn.classList.add('calling-state');
                document.getElementById('btnTitle').textContent = "ОЖИДАЙТЕ";
                document.getElementById('statusMsg').textContent = "Официант уже спешит!";
            } else {
                btn.classList.remove('calling-state');
                document.getElementById('btnTitle').textContent = "ВЫЗВАТЬ";
                document.getElementById('statusMsg').textContent = "Нажмите, чтобы позвать сотрудника";
            }
        });

        btn.addEventListener('pointerdown', () => {
            set(statusRef, { is_calling: !isCalling, timestamp: Date.now() });
        });

        // --- АНИМАЦИЯ И ЛОГИКА ЧАЕВЫХ ---
        onValue(tipRequestRef, (snapshot) => {
            const data = snapshot.val();
            if (data && data.active) {
                runPaymentAnimation(data.amount);
            } else {
                resetToCallScreen();
            }
        });

        function runPaymentAnimation(amount) {
            currentBaseBill = parseFloat(amount);
            
            // Настройка начальных значений
            centerBill.textContent = currentBaseBill.toFixed(0) + " ₽";
            baseBillDisplay.textContent = currentBaseBill.toFixed(0);
            tipTotalEl.textContent = "0"; // Изначально чаевые 0
            
            tipBtns.forEach(b => b.classList.remove('selected'));
            
            callContainer.classList.add('hidden-scale');
            dingSound.play().catch(e => {});

            setTimeout(() => {
                centerBill.classList.add('pop');
            }, 300);

            setTimeout(() => {
                greenWave.classList.add('active');
                centerBill.classList.remove('pop');
                centerBill.style.opacity = '0';
            }, 1200);

            setTimeout(() => {
                modularUi.classList.add('visible');
            }, 1600);

            startTimer();
        }

        // Выбор только суммы чаевых
        tipBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                tipBtns.forEach(b => b.classList.remove('selected'));
                e.target.classList.add('selected');

                const percent = parseInt(e.target.dataset.percent);
                // Высчитываем ТОЛЬКО чаевые
                const tipAmount = currentBaseBill * (percent / 100);
                
                // Выводим только сумму чаевых
                tipTotalEl.textContent = Math.round(tipAmount);
                
                startTimer(); 
            });
        });

        document.getElementById('finishBtn').addEventListener('click', () => {
            set(tipRequestRef, { active: false });
        });

        function resetToCallScreen() {
            modularUi.classList.remove('visible');
            greenWave.classList.remove('active');
            centerBill.classList.remove('pop');
            
            setTimeout(() => {
                callContainer.classList.remove('hidden-scale');
            }, 500);
            
            clearTimeout(tipTimeout);
        }

        function startTimer() {
            clearTimeout(tipTimeout);
            tipTimeout = setTimeout(() => {
                set(tipRequestRef, { active: false });
            }, 60000); 
        }

    </script>
</body>
</html>
