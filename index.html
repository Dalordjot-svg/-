<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>School OS 5.0</title>
    <style>
        :root {
            --bg-dark: #000000;
            --glass: rgba(28, 28, 30, 0.65);
            --glass-solid: #1C1C1E;
            --border: rgba(255, 255, 255, 0.12);
            --primary: #0A84FF;
            --danger: #FF453A;
            --success: #32D74B;
            --text-main: #FFFFFF;
            --text-sec: #8E8E93;
            --safe-area-bottom: env(safe-area-inset-bottom);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* АНИМИРОВАННЫЙ ФОН */
        .blobs { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; filter: blur(90px); opacity: 0.4; }
        .blob { position: absolute; border-radius: 50%; animation: float 12s infinite ease-in-out; }
        .blob-1 { top: -20%; left: -20%; width: 350px; height: 350px; background: var(--primary); }
        .blob-2 { bottom: -20%; right: -20%; width: 300px; height: 300px; background: #BF5AF2; animation-delay: -6s; }
        @keyframes float { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(30px, -30px); } }

        /* ОБЩАЯ СТРУКТУРА */
        .app-container {
            flex: 1; position: relative; overflow-y: auto; scroll-behavior: smooth;
            padding-bottom: calc(90px + var(--safe-area-bottom));
        }
        .view-section { display: none; padding: 20px; animation: fadeIn 0.3s ease; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        /* ТАЙМЕР (Главная) */
        .hero-card {
            background: linear-gradient(145deg, rgba(35,35,35,0.8), rgba(15,15,15,0.8));
            border: 1px solid var(--border); border-radius: 32px; padding: 30px 20px;
            text-align: center; margin-top: 15px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .timer-val { font-size: 72px; font-weight: 800; line-height: 1; margin: 15px 0; font-variant-numeric: tabular-nums; }
        .progress-track { height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: var(--primary); transition: width 1s linear; }

        /* СПИСКИ */
        .list-header { font-size: 28px; font-weight: 800; margin: 20px 0 15px 5px; }
        .glass-item {
            background: rgba(44, 44, 46, 0.4); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border); padding: 16px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .glass-item:first-child { border-top-left-radius: 16px; border-top-right-radius: 16px; }
        .glass-item:last-child { border-bottom-left-radius: 16px; border-bottom-right-radius: 16px; border-bottom: none; }
        .active-day-row { background: rgba(10, 132, 255, 0.15); border-left: 3px solid var(--primary); }

        /* --- АДМИН ПАНЕЛЬ --- */
        
        /* Экран входа */
        #loginScreen { text-align: center; padding-top: 40px; }
        .pin-input {
            background: rgba(255,255,255,0.1); border: 1px solid var(--border);
            color: white; font-size: 24px; padding: 15px; border-radius: 16px;
            width: 200px; text-align: center; letter-spacing: 5px; margin-bottom: 20px; outline: none;
        }
        .pin-btn {
            background: var(--primary); color: white; border: none; padding: 15px 40px;
            font-size: 18px; font-weight: 600; border-radius: 16px; width: 230px;
        }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }

        /* Интерфейс редактора */
        #adminInterface { display: none; }
        .day-selector {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 10px;
        }
        .day-chip {
            background: rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 20px;
            font-size: 14px; font-weight: 600; white-space: nowrap; transition: 0.2s;
        }
        .day-chip.selected { background: var(--primary); color: white; }

        .edit-row {
            background: var(--glass-solid); padding: 15px; margin-bottom: 10px; border-radius: 16px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .edit-info h4 { margin: 0; font-size: 17px; }
        .edit-info p { margin: 4px 0 0; font-size: 13px; color: var(--text-sec); }
        .edit-btn { 
            background: rgba(255,255,255,0.1); width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 18px;
        }

        /* Модальное окно редактирования */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 200;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: 0.2s;
        }
        .modal-overlay.open { opacity: 1; pointer-events: all; }
        .modal-card {
            background: #1C1C1E; width: 85%; max-width: 320px; padding: 25px; border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); transform: scale(0.9); transition: 0.2s;
        }
        .modal-overlay.open .modal-card { transform: scale(1); }

        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: var(--text-sec); margin-bottom: 5px; text-transform: uppercase; }
        .modal-input {
            width: 100%; background: #2C2C2E; border: none; padding: 12px; border-radius: 10px;
            color: white; font-size: 16px; box-sizing: border-box;
        }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-full { flex: 1; padding: 12px; border-radius: 12px; font-weight: 600; border: none; font-size: 15px; }
        .btn-save { background: var(--primary); color: white; }
        .btn-cancel { background: rgba(255,255,255,0.1); color: white; }
        .btn-delete { background: rgba(255, 69, 58, 0.15); color: var(--danger); }

        /* НИЖНЕЕ МЕНЮ */
        .tab-bar {
            position: fixed; bottom: 0; width: 100%; height: calc(60px + var(--safe-area-bottom));
            background: rgba(20, 20, 20, 0.9); backdrop-filter: blur(20px); border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; padding-bottom: var(--safe-area-bottom); z-index: 100;
        }
        .tab-btn { background: none; border: none; color: #666; font-size: 10px; width: 100%; }
        .tab-btn span { font-size: 24px; display: block; margin-bottom: 2px; }
        .tab-btn.active { color: var(--primary); }
    </style>
</head>
<body>

<div class="blobs"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>

<div class="app-container">
    
    <div id="view-timer" class="view-section active">
        <div style="display:flex; justify-content:space-between; padding:0 5px;">
            <div style="font-weight:700; color:var(--text-sec)" id="headerDate">...</div>
            <div style="font-weight:700;" id="headerTime">...</div>
        </div>
        <div class="hero-card">
            <div style="display:inline-block; background:rgba(255,255,255,0.1); padding:5px 12px; border-radius:15px; font-size:12px; font-weight:700; margin-bottom:15px;" id="statusBadge">ЗАГРУЗКА</div>
            <h2 style="margin:0; font-size:26px;" id="mainSubject">...</h2>
            <div style="color:var(--text-sec); margin-bottom:10px;" id="roomSubject">...</div>
            <div class="timer-val" id="countdown">--:--</div>
            <div class="progress-track"><div class="progress-fill" id="progressBar"></div></div>
            <div style="margin-top:20px; font-size:14px; color:var(--text-sec); text-align:left;">
                Далее: <span style="color:white; font-weight:600;" id="nextSubject">...</span>
            </div>
        </div>
    </div>

    <div id="view-schedule" class="view-section">
        <div class="list-header">Неделя</div>
        <div id="fullScheduleList"></div>
    </div>

    <div id="view-settings" class="view-section">
        
        <div id="loginScreen">
            <div style="font-size: 50px; margin-bottom: 20px;">🔒</div>
            <h3>Вход в систему</h3>
            <p style="color:var(--text-sec); margin-bottom:30px;">Введите код доступа админа</p>
            <input type="tel" id="pinInput" class="pin-input" placeholder="••••••" maxlength="6">
            <br>
            <button class="pin-btn" onclick="checkPin()">Войти</button>
        </div>

        <div id="adminInterface">
            <div class="list-header" style="margin-top:0; display:flex; justify-content:space-between;">
                Редактор
                <button onclick="resetData()" style="background:none; border:none; color:var(--danger); font-size:14px;">Сброс</button>
            </div>
            
            <div class="day-selector" id="daySelector">
                </div>

            <div id="editorList" style="margin-bottom: 20px;"></div>

            <button onclick="addNewLesson()" class="pin-btn" style="width:100%; background:rgba(255,255,255,0.1);">+ Добавить урок</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="editModal">
    <div class="modal-card">
        <h3 style="margin-top:0;">Редактирование</h3>
        
        <div class="input-group">
            <label>Название урока</label>
            <input type="text" id="editName" class="modal-input">
        </div>
        <div class="input-group">
            <label>Кабинет</label>
            <input type="text" id="editRoom" class="modal-input">
        </div>
        <div style="display:flex; gap:10px;">
            <div class="input-group" style="flex:1">
                <label>Начало</label>
                <input type="time" id="editStart" class="modal-input">
            </div>
            <div class="input-group" style="flex:1">
                <label>Конец</label>
                <input type="time" id="editEnd" class="modal-input">
            </div>
        </div>

        <div class="modal-actions">
            <button class="btn-full btn-delete" onclick="deleteLesson()">Удалить</button>
            <button class="btn-full btn-cancel" onclick="closeModal()">Отмена</button>
        </div>
        <div class="modal-actions" style="margin-top:10px;">
            <button class="btn-full btn-save" onclick="saveLesson()">Сохранить</button>
        </div>
    </div>
</div>

<nav class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('view-timer', this)"><span>⏱</span>Таймер</button>
    <button class="tab-btn" onclick="switchTab('view-schedule', this)"><span>📅</span>Уроки</button>
    <button class="tab-btn" onclick="switchTab('view-settings', this)"><span>⚙️</span>Настр.</button>
</nav>

<script>
    // --- ДАННЫЕ ---
    const defaultData = {
        1: [ // Пн
            {n:"Классный час", s:"13:10", e:"13:30", r:"А-302"},
            {n:"Музыка", s:"13:35", e:"14:15", r:"Б-310"},
            {n:"Биология", s:"14:20", e:"15:00", r:"Б-206"},
            {n:"Русский язык", s:"15:05", e:"15:45", r:"Б-104"},
            {n:"Алгебра", s:"16:00", e:"16:40", r:"Б-208"},
            {n:"Вероятность", s:"17:10", e:"17:50", r:"Б-208"},
            {n:"Химия", s:"17:30", e:"18:10", r:"Б-105"} 
        ],
        2: [ // Вт
            {n:"Геометрия", s:"13:30", e:"14:10", r:"Б-208"},
            {n:"Физкультура", s:"14:10", e:"14:50", r:"Зал 1"},
            {n:"Литература", s:"15:00", e:"15:40", r:"Б-104"},
            {n:"Физика", s:"15:50", e:"16:30", r:"Б-306"},
            {n:"Английский", s:"16:35", e:"17:15", r:"Б-307"},
            {n:"Химия", s:"17:20", e:"18:00", r:"Б-105"},
            {n:"История", s:"18:05", e:"18:45", r:"Б-305"}
        ],
        3: [ // Ср
            {n:"Английский", s:"13:30", e:"14:10", r:"Б-307"},
            {n:"Русский язык", s:"14:15", e:"14:55", r:"Б-104"},
            {n:"ИЗО", s:"15:00", e:"15:40", r:"А-204"},
            {n:"Алгебра", s:"15:50", e:"16:30", r:"Б-208"},
            {n:"География", s:"16:35", e:"17:15", r:"Б-202"},
            {n:"Биология", s:"17:15", e:"17:55", r:"Б-206"},
            {n:"Труд", s:"18:00", e:"18:35", r:"Мастерская"}
        ],
        4: [ // Чт
            {n:"Классный час", s:"13:10", e:"13:30", r:"А-302"},
            {n:"Физика", s:"13:35", e:"14:15", r:"Б-306"},
            {n:"Литература", s:"14:20", e:"15:00", r:"Б-104"},
            {n:"Алгебра", s:"15:05", e:"15:45", r:"Б-208"},
            {n:"Обществознание", s:"16:00", e:"16:40", r:"Б-305"},
            {n:"Физкультура", s:"16:55", e:"17:35", r:"Зал 1"},
            {n:"Информатика", s:"17:30", e:"18:10", r:"Инфо-2"}
        ],
        5: [ // Пт
            {n:"Русский язык", s:"13:30", e:"14:10", r:"Б-104"},
            {n:"Геометрия", s:"14:15", e:"14:55", r:"Б-208"},
            {n:"Английский", s:"15:00", e:"15:40", r:"Б-307"},
            {n:"История", s:"15:45", e:"16:25", r:"Б-305"},
            {n:"География", s:"16:30", e:"17:10", r:"Б-202"},
            {n:"ОБЗР", s:"17:20", e:"18:00", r:"Б-103"},
            {n:"География", s:"18:05", e:"18:45", r:"Б-202"}
        ]
    };

    let schedule = {};

    function loadData() {
        const saved = localStorage.getItem('schoolOS_v5');
        schedule = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(defaultData));
    }
    function saveData() {
        localStorage.setItem('schoolOS_v5', JSON.stringify(schedule));
        renderScheduleList();
        renderAdminList();
    }
    function resetData() {
        if(confirm("Сбросить все настройки?")) {
            localStorage.removeItem('schoolOS_v5');
            loadData();
            renderAdminList();
            renderScheduleList();
        }
    }

    // --- БЕЗОПАСНОСТЬ ---
    const PIN = "202020";
    function checkPin() {
        const input = document.getElementById('pinInput');
        if(input.value === PIN) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminInterface').style.display = 'block';
            initAdmin();
        } else {
            input.classList.add('shake');
            setTimeout(() => input.classList.remove('shake'), 500);
            input.value = '';
        }
    }

    // --- ЛОГИКА ТАЙМЕРА ---
    function getMin(t) { const [h,m] = t.split(':').map(Number); return h*60+m; }

    function update() {
        const now = new Date();
        const d = now.getDay();
        const curMin = now.getHours()*60 + now.getMinutes();
        
        document.getElementById('headerTime').innerText = now.toLocaleTimeString().slice(0,5);
        document.getElementById('headerDate').innerText = now.toLocaleDateString('ru-RU', {weekday:'short', day:'numeric'}).toUpperCase();

        const today = schedule[d];
        if(!today) {
            setCard('chill', 'ВЫХОДНОЙ', 'Отдыхай!', 0, 100, 'Завтра');
            return;
        }

        let active = false;
        for(let i=0; i<today.length; i++) {
            const l = today[i];
            const s = getMin(l.s);
            const e = getMin(l.e);

            if(curMin >= s && curMin < e) {
                // Идет урок
                const total = (e-s)*60;
                const passed = (curMin-s)*60 + now.getSeconds();
                const next = (i+1 < today.length) ? today[i+1].n : "Домой";
                setCard('lesson', l.n, l.r, total-passed, (passed/total)*100, next);
                active = true; break;
            }
            
            if(i+1 < today.length) {
                // Перемена
                const nextL = today[i+1];
                const nextS = getMin(nextL.s);
                if(curMin >= e && curMin < nextS) {
                    const total = (nextS-e)*60;
                    const passed = (curMin-e)*60 + now.getSeconds();
                    setCard('break', 'ПЕРЕМЕНА', `След: ${nextL.n}`, total-passed, (passed/total)*100, `Каб: ${nextL.r}`);
                    active = true; break;
                }
            }
        }

        if(!active) {
            const first = getMin(today[0].s);
            if(curMin < first) {
                setCard('wait', 'ОЖИДАНИЕ', 'Перед школой', (first*60)-(curMin*60+now.getSeconds()), 0, today[0].n);
            } else {
                setCard('chill', 'ВСЕ УРОКИ', 'Домой!', 0, 100, 'Завтра');
            }
        }
    }

    function setCard(mode, title, sub, sec, pct, next) {
        const badge = document.getElementById('statusBadge');
        const bar = document.getElementById('progressBar');
        
        if(mode==='lesson') { badge.style.background = 'var(--primary)'; badge.innerText = 'ИДЕТ УРОК'; bar.style.background = 'var(--primary)'; }
        else if(mode==='break') { badge.style.background = 'var(--success)'; badge.innerText = 'ПЕРЕМЕНА'; bar.style.background = 'var(--success)'; }
        else { badge.style.background = 'var(--text-sec)'; badge.innerText = mode==='wait'?'СКОРО':'ОТДЫХ'; bar.style.background = '#555'; }

        document.getElementById('mainSubject').innerText = title;
        document.getElementById('roomSubject').innerText = sub;
        document.getElementById('nextSubject').innerText = next;
        
        if(sec > 0) {
            const m = Math.floor(sec/60); const s = Math.floor(sec%60);
            document.getElementById('countdown').innerText = `${m}:${s<10?'0':''}${s}`;
            bar.style.width = `${pct}%`;
        } else {
            document.getElementById('countdown').innerText = mode==='chill' ? '✔' : '--:--';
            bar.style.width = pct + '%';
        }
    }

    // --- ОТРИСОВКА СПИСКА УРОКОВ (READ ONLY) ---
    function renderScheduleList() {
        const container = document.getElementById('fullScheduleList');
        container.innerHTML = '';
        const todayIdx = new Date().getDay();
        const days = ['Вс','Понедельник','Вторник','Среда','Четверг','Пятница','Сб'];

        for(let d=1; d<=5; d++) {
            if(!schedule[d]) continue;
            container.innerHTML += `<div style="padding:15px; font-weight:700; color:${d===todayIdx?'var(--primary)':'#666'}">${days[d]}</div>`;
            const wrapper = document.createElement('div');
            wrapper.style.borderRadius = '16px';
            wrapper.style.overflow = 'hidden';
            
            schedule[d].forEach(l => {
                wrapper.innerHTML += `
                    <div class="glass-item ${d===todayIdx?'active-day-row':''}">
                        <div>
                            <div style="font-weight:600; font-size:16px;">${l.n}</div>
                            <div style="font-size:12px; color:var(--text-sec);">Каб: ${l.r}</div>
                        </div>
                        <div style="text-align:right; font-size:13px; font-family:monospace;">${l.s}<br>${l.e}</div>
                    </div>`;
            });
            container.appendChild(wrapper);
        }
    }

    // --- АДМИН ПАНЕЛЬ ЛОГИКА ---
    let selectedDay = 1;
    let editingIndex = -1;

    function initAdmin() {
        const selector = document.getElementById('daySelector');
        selector.innerHTML = '';
        const days = ['ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ'];
        days.forEach((d, i) => {
            const dayNum = i+1;
            const chip = document.createElement('div');
            chip.className = `day-chip ${dayNum === selectedDay ? 'selected' : ''}`;
            chip.innerText = d;
            chip.onclick = () => { selectedDay = dayNum; initAdmin(); };
            selector.appendChild(chip);
        });
        renderAdminList();
    }

    function renderAdminList() {
        const list = document.getElementById('editorList');
        list.innerHTML = '';
        const lessons = schedule[selectedDay] || [];

        lessons.forEach((l, idx) => {
            const row = document.createElement('div');
            row.className = 'edit-row';
            row.innerHTML = `
                <div class="edit-info">
                    <h4>${l.n}</h4>
                    <p>${l.s} - ${l.e} • ${l.r}</p>
                </div>
                <div class="edit-btn">✎</div>
            `;
            row.onclick = () => openEditModal(idx);
            list.appendChild(row);
        });
    }

    function openEditModal(idx) {
        editingIndex = idx;
        const modal = document.getElementById('editModal');
        const lesson = schedule[selectedDay][idx];
        
        document.getElementById('editName').value = lesson.n;
        document.getElementById('editRoom').value = lesson.r;
        document.getElementById('editStart').value = lesson.s;
        document.getElementById('editEnd').value = lesson.e;
        
        modal.classList.add('open');
    }

    function closeModal() {
        document.getElementById('editModal').classList.remove('open');
        editingIndex = -1;
    }

    function saveLesson() {
        const n = document.getElementById('editName').value;
        const r = document.getElementById('editRoom').value;
        const s = document.getElementById('editStart').value;
        const e = document.getElementById('editEnd').value;

        if(!n || !s || !e) return alert("Заполните поля");

        const newObj = { n, r, s, e };

        if(editingIndex === -1) {
            // Новый урок
            if(!schedule[selectedDay]) schedule[selectedDay] = [];
            schedule[selectedDay].push(newObj);
            // Сортировка по времени
            schedule[selectedDay].sort((a,b) => getMin(a.s) - getMin(b.s));
        } else {
            // Редактирование
            schedule[selectedDay][editingIndex] = newObj;
        }

        saveData();
        closeModal();
    }

    function deleteLesson() {
        if(editingIndex > -1 && confirm("Удалить урок?")) {
            schedule[selectedDay].splice(editingIndex, 1);
            saveData();
            closeModal();
        }
    }

    function addNewLesson() {
        document.getElementById('editName').value = "";
        document.getElementById('editRoom').value = "";
        document.getElementById('editStart').value = "";
        document.getElementById('editEnd').value = "";
        editingIndex = -1;
        document.getElementById('editModal').classList.add('open');
    }

    function switchTab(id, btn) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    // Start
    loadData();
    renderScheduleList();
    setInterval(update, 1000);
    update();

</script>
</body>
</html>
